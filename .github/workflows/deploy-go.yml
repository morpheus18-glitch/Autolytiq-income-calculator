name: Deploy Go App

on:
  push:
    branches: [main]
    paths:
      - 'go-app/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Go Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/income-calculator-autolytiq

            # Pull latest code
            git pull origin main

            # Build Go binary
            cd go-app
            go build -o server .

            # Restart Go app via PM2
            pm2 restart autolytiq-go

            echo "Go app deployed at $(date)"
